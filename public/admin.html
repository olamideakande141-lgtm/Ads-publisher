<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADS PUBLISHER - Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:16px}
h1{font-size:20px}
.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:12px}
button{background:#22c55e;border:0;padding:10px 14px;border-radius:8px;color:#fff;font-weight:700;width:100%;margin-top:8px}
button.small{width:auto;padding:6px 10px;margin:4px 4px 0 0}
button.danger{background:#ef4444}
button.blue{background:#3b82f6}
input{width:100%;padding:10px;border-radius:8px;border:0;margin-top:8px;background:#0f172a;color:#fff;box-sizing:border-box}
.tab{display:flex;gap:8px;margin:12px 0}
.tab button{background:#334155}
.tab button.active{background:#22c55e}
.item{background:#0f172a;padding:10px;border-radius:8px;margin-top:8px;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:#0f172a;padding:10px;border-radius:8px;text-align:center}
.stat b{font-size:18px;display:block}
</style>
</head>
<body>
<h1>🛡️ ADS PUBLISHER ADMIN</h1>

<div id="loginBox" class="card">
<b>Admin Login</b>
<input id="username" placeholder="ADMIN_USERNAME" />
<input id="password" type="password" placeholder="ADMIN_PASSWORD" />
<button onclick="login()">Login</button>
<p style="font-size:12px;opacity:.7">Set ADMIN_USERNAME / ADMIN_PASSWORD for Render Environment. E.g. admin / yourpassword</p>
</div>

<div id="dash" style="display:none">
<div class="card"><div class="stat" id="stats"></div><button onclick="loadAll()">🔄 Refresh</button></div>

<div class="tab">
<button class="active" onclick="showTab('ads',this)">📢 Ads</button>
<button onclick="showTab('deposits',this)">💰 Deposits</button>
<button onclick="showTab('publishers',this)">🤖 Publishers</button>
</div>

<div id="tab-ads" class="card"><h3>Ads Awaiting Moderation / All Ads</h3><div id="adsList"></div></div>
<div id="tab-deposits" class="card" style="display:none"><h3>Deposits</h3><div id="depList"></div></div>
<div id="tab-publishers" class="card" style="display:none"><h3>Publishers</h3><div id="pubList"></div></div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let token = localStorage.getItem('admin_token') || '';
function headers(){ return {'Authorization':'Bearer '+token, 'Content-Type':'application/json'} }
function showTab(id,btn){
  ['ads','deposits','publishers'].forEach(x=> document.getElementById('tab-'+x).style.display = x===id?'block':'none');
  document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
}
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const d=await r.json();
  if(!d.ok && !d.token) return alert(d.error||'Wrong login');
  token=d.token; localStorage.setItem('admin_token',token);
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  loadAll();
}
async function loadAll(){
  try{
    const s=await (await fetch('/api/admin/stats',{headers:headers()})).json();
    if(s.error) throw new Error(s.error);
    document.getElementById('stats').innerHTML=`
      <div><b>${s.totalUsers}</b>Users</div><div><b>${s.totalAds}</b>Ads</div>
      <div><b>${s.pendingModeration}</b>Pending Ads</div><div><b>${s.pendingDeposits}</b>Pending Deposits</div>
      <div><b>${s.pendingPublishers}</b>Pending Publishers</div><div><b>$${s.totalRevenue}</b>Revenue</div>`;
    const ads=await (await fetch('/api/admin/ads',{headers:headers()})).json();
    document.getElementById('adsList').innerHTML=ads.map(a=>`
      <div class="item"><b>#${a.id} ${a.title}</b> - @${a.username||''}<br>$${a.price} | ${a.status} | ${a.placement}<br>
      <button class="small" onclick="adAction(${a.id},'approve')">✅ Approve</button>
      <button class="small blue" onclick="adAction(${a.id},'publish')">🚀 Publish</button>
      <button class="small danger" onclick="adAction(${a.id},'reject')">❌ Reject</button></div>`).join('')||'No ads';
    const deps=await (await fetch('/api/admin/deposits',{headers:headers()})).json();
    document.getElementById('depList').innerHTML=deps.map(d=>`
      <div class="item"><b>#${d.id} ${d.amount} USDT ${d.network}</b> - @${d.username||''}<br>${d.status} | TX: ${d.tx_hash}<br>
      ${d.status==='Pending'?`<button class="small" onclick="depAction(${d.id},'confirm')">✅ Confirm</button><button class="small danger" onclick="depAction(${d.id},'reject')">❌ Reject</button>`:''}</div>`).join('')||'No deposits';
    const pubs=await (await fetch('/api/admin/publishers',{headers:headers()})).json();
    document.getElementById('pubList').innerHTML=pubs.map(p=>`
      <div class="item"><b>${p.bot_username}</b> - ${p.pcode} - ${p.status}<br>
      <button class="small" onclick="pubAction(${p.id},'approve')">✅ Approve</button>
      <button class="small danger" onclick="pubAction(${p.id},'reject')">❌ Reject</button></div>`).join('')||'No publishers';
  }catch(e){ alert('Session expired or login fail: '+e.message); localStorage.removeItem('admin_token'); document.getElementById('loginBox').style.display='block'; document.getElementById('dash').style.display='none'; }
}
async function adAction(id,action){ const r=await fetch(`/api/admin/ad/${id}/${action}`,{method:'POST',headers:headers(),body:JSON.stringify({note:''})}); alert((await r.json()).ok?'Done':'Failed'); loadAll(); }
async function depAction(id,action){ const r=await fetch(`/api/admin/deposit/${id}/${action}`,{method:'POST',headers:headers(),body:JSON.stringify({note:''})}); alert((await r.json()).ok?'Done':'Failed'); loadAll(); }
async function pubAction(id,action){ const r=await fetch(`/api/admin/publisher/${id}/${action}`,{method:'POST',headers:headers(),body:JSON.stringify({})}); alert((await r.json()).ok?'Done':'Failed'); loadAll(); }
if(token){ document.getElementById('loginBox').style.display='none'; document.getElementById('dash').style.display='block'; loadAll(); }
</script>
</body>
</html>
