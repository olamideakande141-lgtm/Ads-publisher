<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADS PUBLISHER - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0B0E1A;color:white;font-family:Inter,sans-serif}.card{background:#1A1F36;border:1px solid #2A3452}input,select,textarea{background:#0B0E1A;border:1px solid #2A3452;padding:10px;border-radius:10px;width:100%;font-size:14px;color:white}</style></head>
<body class="p-4 max-w-6xl mx-auto"><h1 class="text-2xl font-black">ADS PUBLISHER - ADMIN</h1>
<div id="loginBox" class="card p-5 mt-4 max-w-sm"><p class="font-bold">Admin Login</p><input id="au" placeholder="Username" class="mt-3"><input id="ap" type="password" placeholder="Password" class="mt-2"><button onclick="login()" class="bg-[#8B7CF8] w-full mt-3 py-3 rounded-full font-bold">Login</button></div>
<div id="dash" class="hidden">
<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4" id="stats"></div>
<div class="flex gap-2 mt-4 flex-wrap">
<button onclick="showSec('deposits')" class="bg-[#8B7CF8] px-4 py-2 rounded-full text-sm">Deposits</button>
<button onclick="showSec('ads')" class="bg-[#8B7CF8] px-4 py-2 rounded-full text-sm">Moderation</button>
<button onclick="showSec('publishers')" class="bg-[#FF8C00] px-4 py-2 rounded-full text-sm">Publishers - Pass Codes</button>
<button onclick="showSec('users')" class="bg-[#8B7CF8] px-4 py-2 rounded-full text-sm">Users</button>
<button onclick="showSec('packages')" class="bg-[#8B7CF8] px-4 py-2 rounded-full text-sm">Pricing</button>
<button onclick="showSec('settings')" class="bg-[#10B981] px-4 py-2 rounded-full text-sm">Wallet & Settings</button>
<button onclick="showSec('pubs')" class="bg-[#10B981] px-4 py-2 rounded-full text-sm">Publications</button>
</div><div id="content" class="mt-4 space-y-3"></div></div>
<script>
let token=localStorage.getItem('admin_token')||'';
function ah(){ return {'Content-Type':'application/json','Authorization':'Bearer '+token}; }
async function login(){ const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('au').value,password:document.getElementById('ap').value})}); const d=await res.json(); if(d.ok){ token=d.token; localStorage.setItem('admin_token',token); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); loadStats(); showSec('deposits'); } else alert(d.error); }
async function loadStats(){ const r=await fetch('/api/admin/stats',{headers:ah()}); const s=await r.json(); document.getElementById('stats').innerHTML=Object.entries(s).map(([k,v])=> `<div class="card p-3 rounded-[16px]"><p class="text-[11px] text-gray-400">${k}</p><p class="text-xl font-black">${v}</p></div>`).join(''); }
async function showSec(sec){
  const c=document.getElementById('content');
  if(sec==='deposits'){ const r=await fetch('/api/admin/deposits',{headers:ah()}); const list=await r.json(); c.innerHTML='<h2 class="font-bold text-lg">Deposits - Confirm / Reject</h2>'+list.map(d=> `<div class="card p-3 rounded-[16px]"><div class="flex justify-between"><b>#${d.id} - ${d.amount} USDT ${d.network}</b><span>${d.status}</span></div><p class="text-xs text-gray-400">User @${d.username||''} (${d.telegram_id}) | TX: <span class="break-all">${d.tx_hash}</span></p>${d.proof_path?`<a href="/${d.proof_path}" target="_blank" class="text-blue-400 text-xs">View Proof</a>`:''}${d.status==='Pending'?`<div class="flex gap-2 mt-2"><button onclick="depAction(${d.id},'confirm')" class="bg-green-600 px-4 py-2 rounded-full text-xs font-bold">Confirm - Credit Wallet</button><button onclick="depAction(${d.id},'reject')" class="bg-red-600 px-4 py-2 rounded-full text-xs font-bold">Reject</button></div>`:''}</div>`).join(''); }
  if(sec==='ads'){ const r=await fetch('/api/admin/ads',{headers:ah()}); const list=await r.json(); c.innerHTML='<h2 class="font-bold text-lg">Moderation</h2>'+list.map(a=> `<div class="card p-3 rounded-[16px]"><div class="flex justify-between"><b>${a.title}</b><span class="text-xs bg-[#0B0E1A] px-2 py-1 rounded-full">${a.status}</span></div><p class="text-xs text-gray-400">${a.category} | ${a.placement} | $${a.price} | @${a.username||''}</p><p class="text-xs mt-1">${a.description||''}</p><a href="${a.destination_url}" target="_blank" class="text-blue-400 text-xs break-all">${a.destination_url}</a>${a.media_path?`<div><a href="/${a.media_path}" target="_blank" class="text-blue-400 text-xs">View Media</a></div>`:''}<div class="flex gap-2 mt-2 flex-wrap"><button onclick="adAction(${a.id},'approve')" class="bg-green-600 px-3 py-2 rounded-full text-xs">Approve</button><button onclick="adAction(${a.id},'reject')" class="bg-red-600 px-3 py-2 rounded-full text-xs">Reject + Refund</button><button onclick="adAction(${a.id},'publish')" class="bg-blue-600 px-3 py-2 rounded-full text-xs">Publish to Channel</button><button onclick="adAction(${a.id},'pause')" class="bg-yellow-600 px-3 py-2 rounded-full text-xs">Pause</button><button onclick="adAction(${a.id},'resume')" class="bg-green-600 px-3 py-2 rounded-full text-xs">Resume</button><button onclick="adAction(${a.id},'cancel')" class="bg-gray-600 px-3 py-2 rounded-full text-xs">Cancel</button></div></div>`).join(''); }
  if(sec==='publishers'){ const r=await fetch('/api/admin/publishers',{headers:ah()}); const list=await r.json(); c.innerHTML='<h2 class="font-bold text-lg">Publishers - Approve Pass Codes</h2>'+list.map(p=> `<div class="card p-3 rounded-[16px]"><div class="flex justify-between"><b>${p.bot_username} - <span class="text-orange-400">${p.pcode}</span></b><span>${p.status}</span></div><p class="text-xs">User @${p.username||''} | Views ${p.total_views} | Earned $${p.total_earned} | API ${p.api_key}</p><p class="text-xs break-all">SDK: ${location.origin}/sdk.js?id=${p.pcode}</p><div class="flex gap-2 mt-2"><button onclick="pubAction(${p.id},'approve')" class="bg-green-600 px-3 py-2 rounded-full text-xs">Approve</button><button onclick="pubAction(${p.id},'reject')" class="bg-red-600 px-3 py-2 rounded-full text-xs">Reject</button><button onclick="pubAction(${p.id},'suspend')" class="bg-yellow-600 px-3 py-2 rounded-full text-xs">Suspend</button></div></div>`).join(''); }
  if(sec==='users'){ const r=await fetch('/api/admin/users',{headers:ah()}); const list=await r.json(); c.innerHTML='<h2 class="font-bold text-lg">Users</h2>'+list.map(u=> `<div class="card p-3 rounded-[16px] flex justify-between"><span>@${u.username||''} (${u.telegram_id}) - ${u.status}<br><span class="text-xs">Balance ${u.available||0} | Deposited ${u.total_deposited||0}</span></span><button onclick="suspendUser(${u.id})" class="bg-red-600 px-3 py-1 rounded-full text-xs">Suspend</button></div>`).join(''); }
  if(sec==='packages'){ const r=await fetch('/api/admin/packages',{headers:ah()}); const list=await r.json(); c.innerHTML=`<h2 class="font-bold text-lg">Pricing</h2><div class="card p-3 rounded-[16px]"><input id="pn" placeholder="Name"><input id="pp" placeholder="Placement" class="mt-2"><input id="ppr" type="number" placeholder="Price USDT" class="mt-2"><input id="pd" type="number" placeholder="Duration days" class="mt-2"><button onclick="createPkg()" class="bg-[#8B7CF8] w-full mt-2 py-2 rounded-full font-bold">Create Package</button></div>`+list.map(p=> `<div class="card p-3 rounded-[16px] flex justify-between"><span>${p.name} - $${p.price} - ${p.duration_days}d - ${p.placement}</span><button onclick="delPkg(${p.id})" class="bg-red-600 px-3 py-1 rounded-full text-xs">Delete</button></div>`).join(''); }
  if(sec==='settings'){ const r=await fetch('/api/admin/settings',{headers:ah()}); const list=await r.json(); const o={}; list.forEach(x=> o[x.key]=x.value); c.innerHTML=`<h2 class="font-bold text-lg">Wallet & Settings</h2><div class="card p-4 rounded-[16px] space-y-2"><label class="text-xs">USDT TRC20 Address</label><input id="sTRC" value="${o.USDT_TRC20||''}" placeholder="T..."><label class="text-xs">USDT ERC20 Address</label><input id="sERC" value="${o.USDT_ERC20||''}" placeholder="0x..."><label class="text-xs">Publisher Reward Per View</label><input id="sReward" value="${o.PUBLISHER_REWARD_PER_VIEW||'0.005'}"><label class="text-xs">Support</label><input id="sSup" value="${o.SUPPORT_USERNAME||''}"><button onclick="saveSettings()" class="bg-[#10B981] w-full py-3 rounded-full font-bold">Save Settings</button></div>`; }
  if(sec==='pubs'){ const r=await fetch('/api/admin/publications',{headers:ah()}); const list=await r.json(); c.innerHTML='<h2 class="font-bold text-lg">Publishing History</h2>'+list.map(p=> `<div class="card p-3 rounded-[16px] text-xs">${p.title} - ${p.channel} - Msg ${p.message_id} - ${p.published_at}</div>`).join(''); }
}
async function depAction(id,act){ await fetch(`/api/admin/deposit/${id}/${act}`,{method:'POST',headers:ah(),body:JSON.stringify({note:'Admin'})}); loadStats(); showSec('deposits'); }
async function adAction(id,act){ await fetch(`/api/admin/ad/${id}/${act}`,{method:'POST',headers:ah(),body:JSON.stringify({note:'Admin'})}); loadStats(); showSec('ads'); }
async function pubAction(id,act){ await fetch(`/api/admin/publisher/${id}/${act}`,{method:'POST',headers:ah()}); loadStats(); showSec('publishers'); }
async function suspendUser(id){ await fetch(`/api/admin/user/${id}/suspend`,{method:'POST',headers:ah()}); showSec('users'); }
async function createPkg(){ await fetch('/api/admin/packages',{method:'POST',headers:ah(),body:JSON.stringify({name:document.getElementById('pn').value,placement:document.getElementById('pp').value,price:parseFloat(document.getElementById('ppr').value),duration_days:parseInt(document.getElementById('pd').value)})}); showSec('packages'); }
async function delPkg(id){ await fetch(`/api/admin/packages/${id}`,{method:'DELETE',headers:ah()}); showSec('packages'); }
async function saveSettings(){ await fetch('/api/admin/settings',{method:'POST',headers:ah(),body:JSON.stringify({USDT_TRC20:document.getElementById('sTRC').value,USDT_ERC20:document.getElementById('sERC').value,PUBLISHER_REWARD_PER_VIEW:document.getElementById('sReward').value,SUPPORT_USERNAME:document.getElementById('sSup').value})}); alert('Saved'); }
if(token){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); loadStats(); showSec('deposits'); }
</script></body></html>
